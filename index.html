<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paint Him</title>
<style>
  :root{--bg:#bdffa9;--card:#fbfff9;--ink:#2b0a25;--mute:#7a5a74;--line:#00000018;--acc:#ff15c6}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:linear-gradient(160deg,#bdffa9 45%,#ff8fe0 100%) fixed;color:var(--ink)}
  #app{display:flex;gap:16px;padding:16px;height:100vh}
  #view{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:16px;overflow:hidden;position:relative}
  #view canvas{max-width:100%;max-height:100%}
  #status{position:absolute;left:16px;top:16px;padding:6px 12px;border-radius:99px;background:#000a;color:#fff;font-size:12px;backdrop-filter:blur(8px)}
  #status.ok{display:none}
  #side{width:380px;display:flex;flex-direction:column;gap:14px;overflow:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;font-size:22px;letter-spacing:-.02em}
  h2{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
  #paintwrap{position:relative;width:100%;aspect-ratio:1;background:#ead8c2;border-radius:12px;overflow:hidden}
  #paintwrap canvas{position:absolute;inset:0;width:100%;height:100%}
  #paint{mix-blend-mode:multiply;cursor:crosshair;touch-action:none}
  #guide{pointer-events:none}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sw{width:28px;height:28px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px #0003;cursor:pointer;transition:transform .12s}
  .sw:hover{transform:scale(1.1)}
  .sw.on{box-shadow:inset 0 0 0 1px #0003,0 0 0 2px var(--card),0 0 0 4px var(--acc)}
  button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:background .12s}
  button:hover{background:var(--bg)}
  button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
  #save{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600;padding:12px}
  #save:hover{opacity:.88;background:var(--acc)}
  .pw{position:relative}
  .shp{width:40px;height:40px;padding:0;font-size:18px}
  #shapebar[hidden]{display:none}
  #wheel{width:44px;height:36px;padding:0;border-radius:10px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);background:#111}
  #pop{position:absolute;z-index:5;top:44px;left:0;width:264px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px #0003}
  #pop[hidden]{display:none}
  #sv{width:100%;height:auto;border-radius:8px;cursor:crosshair;touch-action:none}
  #hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:99px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);padding:0}
  #hue::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #0008;cursor:pointer}
  #camoff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#111;color:#fff;text-align:center;padding:24px}
  #camoff[hidden]{display:none}
  #camoff p{margin:0;max-width:320px;color:#c9c6bf}
  #camoff button{background:#fff;color:#111;border:0;font-weight:600;padding:10px 20px}
  #hex{width:110px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px ui-monospace,monospace;text-transform:lowercase}
  #hex.bad{border-color:#e11d48}
  label{display:flex;align-items:center;gap:10px;color:var(--mute)}
  label span{width:40px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  /* poster style: flat blocks, sharp corners, bold caps, pink rays on green */
  body{font-family:"Helvetica Neue",Arial,sans-serif;background:
    conic-gradient(from 8deg at 22% 62%,#ff15c600 0 6%,#ff15c68c 6% 13%,#ff15c600 13% 28%,#ff15c68c 28% 31%,#ff15c600 31% 52%,#ff15c68c 52% 60%,#ff15c600 60% 82%,#ff15c68c 82% 88%,#ff15c600 88%) fixed,
    linear-gradient(160deg,#bdffa9 50%,#ff8fe0 130%) fixed}
  #view,.card,#paintwrap,button,#hex,#wheel,#pop,#sv,#status{border-radius:0}
  #view{border-left:10px solid var(--acc)}
  .card{border:0;border-left:10px solid var(--acc)}
  .sw{border-radius:0;box-shadow:inset 0 0 0 1px #0004}
  .sw.on{box-shadow:inset 0 0 0 1px #0004,0 0 0 2px var(--card),0 0 0 4px var(--acc)}
  h2{color:var(--acc);font-weight:800;font-size:12px;letter-spacing:.14em}
  button{text-transform:uppercase;font-weight:700;font-size:12px;letter-spacing:.08em;border:1px solid var(--ink)}
  button.on,#save{border-color:var(--acc)}
  #save{font-size:14px;padding:16px;letter-spacing:.14em}
  .sw,.shp{border:0}
  .shp{border:1px solid var(--ink)}
  #hue,input[type=range]{border-radius:0}
  /* glass + motion */
  :root{--ease:cubic-bezier(.2,.8,.2,1)}
  body{background:linear-gradient(160deg,#bdffa9 50%,#ff8fe0 130%) fixed}
  body::before{content:"";position:fixed;z-index:-2;width:220vmax;height:220vmax;left:-70vmax;top:-30vmax;pointer-events:none;
    background:conic-gradient(#ff15c600 0 6%,#ff15c68c 6% 13%,#ff15c600 13% 28%,#ff15c68c 28% 31%,#ff15c600 31% 52%,#ff15c68c 52% 60%,#ff15c600 60% 82%,#ff15c68c 82% 88%,#ff15c600 88%);
    animation:spin 90s linear infinite}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(40vmax 40vmax at 20% 80%,#ff15c655,transparent 70%),radial-gradient(35vmax 35vmax at 85% 15%,#bdffa9cc,transparent 70%);
    animation:drift 14s ease-in-out infinite alternate}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes drift{to{transform:translate(-4vmax,3vmax) scale(1.12)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
  @keyframes fade{from{opacity:0}}

  #view{background:#ffffff4d;align-self:flex-start;aspect-ratio:16/9;box-shadow:0 20px 50px #ff15c633;animation:rise .6s var(--ease) both}
  .card{background:#ffffff4d;backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid #ffffff99;border-left:10px solid var(--acc);box-shadow:0 8px 32px #ff15c622,inset 0 1px 0 #fff9;animation:rise .6s var(--ease) both}
  .card:has(#pop){position:relative;z-index:5}
  #side>:nth-child(1){animation-delay:.08s}#side>:nth-child(2){animation-delay:.16s}#side>:nth-child(3){animation-delay:.24s}#side>:nth-child(4){animation-delay:.32s}
  #shapebar:not([hidden]){animation:pop .35s var(--ease) both}
  #pop{background:#ffffffd9;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid #fff;animation:pop .25s var(--ease) both;transform-origin:top left}
  #view canvas{display:block;width:100%;height:100%}
  #camoff{background:#2b0a25d9;backdrop-filter:blur(18px);animation:fade .4s both}
  #status{background:#ffffff40;color:#fff;border:1px solid #ffffff66;backdrop-filter:blur(12px)}
  button{background:#ffffff55;backdrop-filter:blur(8px);transition:transform .2s var(--ease),background .2s,box-shadow .2s}
  button:hover{background:#ffffffaa;transform:translateY(-2px);box-shadow:0 6px 16px #ff15c633}
  button:active{transform:scale(.96)}
  button.on,#save{background:var(--acc);color:#fff;backdrop-filter:none}
  button.on:hover,#save:hover{background:var(--acc);opacity:1;box-shadow:0 8px 22px #ff15c688}
  #camoff button{background:#fff;color:#111}
  #hex,#wheel{background:#ffffff66;backdrop-filter:blur(8px);transition:box-shadow .2s}
  #hex:focus{outline:0;box-shadow:0 0 0 2px var(--acc)}
  #paintwrap{box-shadow:0 0 0 1px #fff9,0 8px 24px #0002}
  .sw{transition:transform .2s var(--ease),box-shadow .2s}
  /* no pink side strips, soft corners */
  #view,.card{border-left:1px solid #ffffff99}
  #view{border-radius:20px;overflow:hidden}
  .card{border-radius:20px}
  #paintwrap,#pop{border-radius:14px}
  #sv{border-radius:10px}
  button,#hex,#wheel{border-radius:12px}
  .sw{border-radius:50%}
  #hue,input[type=range]{border-radius:99px}
  #status{border-radius:99px}
  /* calm neutral palette (replaces pink/green) */
  :root{--bg:#ece9e3;--card:#f7f5f1;--ink:#1c1b19;--mute:#8a867e;--line:#00000014;--acc:#1c1b19;--on:#fff;--glass:#ffffff80;--glass2:#ffffffb3;--sh:#0000001f}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#f1efea;--mute:#8d8a83;--line:#ffffff1a;--acc:#f1efea;--on:#141413;--glass:#ffffff12;--glass2:#ffffff24;--sh:#0006}}
  body{background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--bg) 88%,var(--ink)) ) fixed}
  body::before{display:none}
  body::after{background:radial-gradient(45vmax 45vmax at 15% 85%,#ffffff55,transparent 70%),radial-gradient(40vmax 40vmax at 90% 10%,#ffffff40,transparent 70%)}
  #view,.card{border:1px solid var(--line);box-shadow:0 10px 30px var(--sh),inset 0 1px 0 #ffffff33}
  #view{background:var(--glass)}
  .card{background:var(--glass)}
  h2{color:var(--mute)}
  button{background:var(--glass);border-color:var(--line);color:var(--ink)}
  button:hover{background:var(--glass2);box-shadow:0 6px 16px var(--sh)}
  button.on,#save{background:var(--acc);color:var(--on);border-color:var(--acc)}
  button.on:hover,#save:hover{background:var(--acc);box-shadow:0 8px 20px var(--sh)}
  .shp{border:1px solid var(--line)}
  #hex,#wheel{background:var(--glass);color:var(--ink);border-color:var(--line)}
  #pop{background:var(--glass2);border-color:var(--line);box-shadow:0 12px 32px var(--sh)}
  #camoff{background:#1c1b19d9}
  #status{background:#0006;border-color:#ffffff33}
  #paintwrap{background:#e3d3c0;box-shadow:0 0 0 1px var(--line)}
  #layers{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
  .layer{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;transition:background .2s,transform .2s var(--ease)}
  .layer:hover{background:var(--glass2)}
  .layer.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .layer canvas{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;flex:none}
  .layer span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eye{padding:4px 8px;background:transparent;border:0;font-size:16px;text-transform:none;letter-spacing:0;transform:none!important;box-shadow:none!important}
  button:disabled{opacity:.4;pointer-events:none}
  select,label.btn{font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;transition:background .2s}
  select:hover,label.btn:hover{background:var(--glass2)}
  label.btn{display:inline-block;gap:0}
  #rec.on{animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
  @media (max-width:800px){#app{flex-direction:column;height:auto}#side{width:100%}}
</style>
</head>
<body>
<div id="app">
  <div id="view"><div id="status">Loading…</div>
    <div id="camoff" hidden><strong>Kameran kapalı</strong><p id="cammsg">Yüzüne çizim yapabilmek için kamerayı açmak ister misin?</p><button id="camon">Kamerayı aç</button></div>
  </div>
  <div id="side">
    <div class="card">
      <h2>Face map</h2>
      <div id="paintwrap"><canvas id="paint" width="1024" height="1024"></canvas><canvas id="guide" width="1024" height="1024"></canvas></div>
    </div>
    <div class="card">
      <h2>Tools</h2>
      <div class="row"><button id="brush" class="on">Brush</button><button id="eraser">Eraser</button><button id="shapes">Shapes</button><button id="clear">Clear</button><button id="mesh" class="on">Mesh</button></div>
      <div class="row"><button id="undo" title="Ctrl+Z">Undo</button><button id="redo" title="Ctrl+Shift+Z">Redo</button><button id="sym" title="Mirror strokes across the face">Symmetry</button></div>
      <div class="row" id="colors"></div>
      <div class="row"><div class="pw"><button id="wheel" title="Custom color"></button><div id="pop" hidden><canvas id="sv" width="240" height="160"></canvas><input id="hue" type="range" min="0" max="360" value="0"></div></div><input id="hex" type="text" value="#111111" maxlength="7" spellcheck="false" placeholder="#rrggbb"></div>
      <label><span>Size</span><input id="size" type="range" min="4" max="120" value="40"></label>
      <label><span>Soft</span><input id="soft" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    </div>
    <div class="card">
      <h2>Layers</h2>
      <div id="layers"></div>
      <div class="row"><button id="ladd">+ Add</button><button id="lup" title="Move up">▲</button><button id="ldown" title="Move down">▼</button><button id="ldel">Delete</button></div>
      <label><span>Layer</span><input id="lop" type="range" min="0" max="1" step="0.05" value="1"></label>
    </div>
    <div class="card">
      <h2>Extras</h2>
      <label><span>Opacity</span><input id="op" type="range" min="0.1" max="1" step="0.05" value="1"></label>
      <div class="row">
        <select id="tpl"><option value="">Template…</option><option value="panda">Panda</option><option value="clown">Clown</option><option value="blush">Blush</option><option value="cat">Cat</option></select>
        <button id="export">Export map</button>
        <label class="btn">Import map<input id="import" type="file" accept="image/*" hidden></label>
      </div>
    </div>
    <div class="card" id="shapebar" hidden>
      <h2>Shape</h2>
      <div class="row" id="shapelist"></div>
      <div class="row"><button id="fillbtn">Filled</button><button id="apply">Apply</button><button id="del">Delete</button></div>
      <label><span>Rotate</span><input id="rot" type="range" min="0" max="360" value="0"></label>
      <div style="color:var(--mute);font-size:12px">Drag on the map to draw. Drag the box to move, top knob to rotate, corner knob to resize. Enter = apply, Esc = delete.</div>
    </div>
    <div class="row"><button id="save" style="flex:1">Save photo</button><button id="rec">Record</button></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
